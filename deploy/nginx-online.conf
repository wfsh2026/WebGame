# Include only inside the selected server block. Original / remains unchanged.
location = /online { return 302 /online/; }
location /online/api/ {
    proxy_pass http://127.0.0.1:13101/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location /online/room/ {
    proxy_pass http://127.0.0.1:13102/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
}
location /online/assets/ {
    alias /opt/web-game-online/current/apps/web/dist/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";
}
location /online/ {
    alias /opt/web-game-online/current/apps/web/dist/;
    index online.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "same-origin";
}
